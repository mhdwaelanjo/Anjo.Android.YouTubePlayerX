<!DOCTYPE html>
<html>

<head>
    <title></title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://www.youtube.com/iframe_api" type="text/javascript"></script>

    <style type="text/css">
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden;
            position: fixed;
        }
    </style>
</head>

<body>
<!-- 1. The <iframe> (and video player) will replace this <div> tag. -->
    <div id="youTubePlayerDOM"></div>
</body>

<script type="text/javascript">

    // 2. This code loads the IFrame Player API code asynchronously.
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    // 3. This function creates an <iframe> (and YouTube player) after the API code downloads.
    var UNSTARTED = "UNSTARTED";
    var ENDED = "ENDED";
    var PLAYING = "PLAYING";
    var PAUSED = "PAUSED";
    var BUFFERING = "BUFFERING";
    var CUED = "CUED";

    var YouTubeBridge = window.YouTubePlayerBridge;
    var player;

    var timerId;

   

    function onYouTubeIframeAPIReady() {

        YouTubeBridge.SendYouTubeIframeApiReady();

        player = new YT.Player('youTubePlayerDOM', {

            height: '100%',
            width: '100%',

            events: {
                'onReady': function (event) {
                    // 4. The API will call this function when the video player is ready.
                    playVideo();
                    YouTubeBridge.SendReady();
                },
                'onStateChange': function (event) { sendPlayerStateChange(event.data); },
                'onPlaybackQualityChange': function (event) { YouTubeBridge.SendPlaybackQualityChange(event.data); },
                'onPlaybackRateChange': function (event) { YouTubeBridge.SendPlaybackRateChange(event.data); },
                'onError': function (error) { YouTubeBridge.SendError(error.data); },
                'onApiChange': function (event) { YouTubeBridge.SendApiChange(); }
            },

            playerVars: {
                'modestbranding': 1,
                'autoplay': 1,
                'autohide': 1,
                'playsinline': 1,
                'controls': 0,
                'enablejsapi': 1,
                'fs': 0,
                'origin': 'https://www.youtube.com',
                'rel': 0,
                //'showinfo': 0,
                'iv_load_policy': 3
            }
        });
    }
    
    function sendPlayerStateChange(playerState) {
        clearTimeout(timerId);

        switch (playerState) {
            case YT.PlayerState.UNSTARTED:
                sendStateChange(UNSTARTED);
                return;

            case YT.PlayerState.ENDED:
                sendStateChange(ENDED);
                return;

            case YT.PlayerState.PLAYING:
                sendStateChange(PLAYING);

                startSendCurrentTimeInterval();
                sendVideoData(player);
                return;

            case YT.PlayerState.PAUSED:
                sendStateChange(PAUSED);
                return;

            case YT.PlayerState.BUFFERING:
                sendStateChange(BUFFERING);
                return;

            case YT.PlayerState.CUED:
                sendStateChange(CUED);
                return;
        }

        function sendVideoData(player) {
            var videoDuration = player.getDuration();

            YouTubeBridge.SendVideoDuration(videoDuration);
        }

        function sendStateChange(newState) {
            YouTubeBridge.SendStateChange(newState);
        }

        function startSendCurrentTimeInterval() {
            timerId = setInterval(function () {
                YouTubeBridge.SendVideoCurrentTime(player.getCurrentTime());
                YouTubeBridge.SendVideoLoadedFraction(player.getVideoLoadedFraction());
            }, 100);
        }
    }

    // JAVA to WEB functions

    function seekTo(startSeconds) {
        player.seekTo(startSeconds, true);
    }

    function pauseVideo() {
        player.pauseVideo();
    }

    function playVideo() {
        player.playVideo();
    }
    
    function stopVideo() {
        player.stopVideo();
    }
    
    function loadVideo(videoId, startSeconds) {
        //player.loadVideoById(videoId, startSeconds, "large");
        player.loadVideoById(videoId, startSeconds);
        //player.loadVideoById({ 'videoId': videoId, 'startSeconds': startSeconds, 'suggestedQuality': 'large' });
        YouTubeBridge.SendVideoId(videoId);
    }

    function cueVideo(videoId, startSeconds) {
        player.cueVideoById(videoId, startSeconds);
        YouTubeBridge.SendVideoId(videoId);
    }

    function mute() {
        player.mute();
    }

    function unMute() {
        player.unMute();
    }

    function setVolume(volumePercent) {
        player.setVolume(volumePercent);
    }
    
    window.onresize = function () {
        if (player)
            player.setSize(window.innerWidth, window.innerHeight);
    }

    // JAVA to WEB functions V2022
    function onDestroy() {
        player.destroy();
    }

    function setPlaybackRate(suggestedRate) {
        player.setPlaybackRate(suggestedRate);
    }

    function setLoop(loopPlaylists) {
        player.setLoop(loopPlaylists);
    }

    function setShuffle(shufflePlaylist) {
        player.setShuffle(shufflePlaylist);
    }

</script>
</html>
